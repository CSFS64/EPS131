name: One-time import EEW Lab source
on:
  push:
    paths:
      - 'eew-source.tgz'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract EEW Lab
        run: |
          tar -xzf eew-source.tgz
          rm eew-source.tgz
          rm .github/workflows/bootstrap.yml
          node --test tests/physics.test.mjs
      - name: Commit full source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete EEW Lab V0.1.1 source'
          git push
