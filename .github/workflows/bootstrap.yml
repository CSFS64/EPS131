name: Import EEW Lab source (one-time)
on:
  push:
    paths:
      - '.eewparts/part-06.txt'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack validated full source
        shell: bash
        run: |
          cat .eewparts/part-{01..06}.txt | base64 --decode > /tmp/eew-source.tar.xz
          echo '5b8929aeb3adcdee9111e09882060f7265f5b9c77baa052468cc935be1970768  /tmp/eew-source.tar.xz' | sha256sum --check
          tar -xJf /tmp/eew-source.tar.xz
          node --test tests/physics.test.mjs
          rm -rf .eewparts
          rm -f .github/workflows/bootstrap.yml
      - name: Commit imported source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import full EEW Lab v0.1.1 source'
          git push
